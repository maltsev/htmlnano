<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Us</title></head><body> <h1>Contact Us</h1> <form action="https://example.com/submit" method="post" enctype="multipart/form-data"> <fieldset> <legend>Your details</legend> <label for="name">Name</label> <input type="text" id="name" name="name" required placeholder="Jane Doe" autocomplete="name"> <label for="email">Email</label> <input type="email" id="email" name="email" required placeholder="jane@example.com"> <label for="country">Country</label> <select id="country" name="country"> <option value>-- Select --</option> <option value="us" selected>United States</option> <option value="ca">Canada</option> <option value="gb">United Kingdom</option> </select> <label for="topic">Topic</label> <input type="text" id="topic" name="topic" list="topics"> <datalist id="topics"> <option value="Sales"></option> <option value="Support"></option> <option value="Billing"></option> </datalist> </fieldset> <fieldset> <legend>Preferences</legend> <label><input type="checkbox" name="newsletter" value="yes" checked> Subscribe to newsletter</label> <p>Preferred contact method:</p> <label><input type="radio" name="contact" value="email" checked> Email</label> <label><input type="radio" name="contact" value="phone"> Phone</label> <label for="message">Message</label> <textarea id="message" name="message" rows="4" cols="40" placeholder="How can we help?"></textarea> </fieldset> <button type="submit" disabled>Send message</button> <button type="reset">Clear</button> <input type="hidden" name="csrf" value="abc123token"> </form> </body></html>
