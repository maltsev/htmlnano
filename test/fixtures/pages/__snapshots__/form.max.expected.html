<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta content="width=device-width, initial-scale=1.0" name=viewport><title>Contact Us</title></head><body><h1>Contact Us</h1><form action=https://example.com/submit enctype=multipart/form-data method=post><fieldset><legend>Your details</legend><label for=name>Name</label><input autocomplete=name id=name name=name placeholder="Jane Doe" required><label for=email>Email</label><input id=email name=email placeholder=jane@example.com required type=email><label for=country>Country</label><select id=country name=country><option value>-- Select --</option><option selected value=us>United States</option><option value=ca>Canada</option><option value=gb>United Kingdom</option></select><label for=topic>Topic</label><input id=topic list=topics name=topic><datalist id=topics><option value=Sales></option><option value=Support></option><option value=Billing></option></datalist></fieldset><fieldset><legend>Preferences</legend><label><input checked name=newsletter type=checkbox value=yes>Subscribe to newsletter</label><p>Preferred contact method:</p><label><input checked name=contact type=radio value=email>Email</label><label><input name=contact type=radio value=phone>Phone</label><label for=message>Message</label><textarea cols=40 id=message name=message placeholder="How can we help?" rows=4></textarea></fieldset><button disabled>Send message</button><button type=reset>Clear</button><input name=csrf type=hidden value=abc123token></form></body></html>
