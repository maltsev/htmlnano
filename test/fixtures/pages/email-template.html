<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--[if mso]>
    <style type="text/css">
        table { border-collapse: collapse; }
        .fallback-font { font-family: Arial, sans-serif !important; }
    </style>
    <![endif]-->
    <!--[if !mso]><!-->
    <style type="text/css">
        @media only screen and (max-width: 600px) {
            .container { width: 100% !important; }
        }
    </style>
    <!--<![endif]-->
    <title>Newsletter Template</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4;">
    <div style="display:none; max-height:0; overflow:hidden;">Your weekly update is here.</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td style="padding:24px; font-family:Arial, sans-serif; color:#333333;">
                            <h1 style="margin:0 0 16px 0;">Weekly Digest</h1>
                            <p>Hello {{ firstName }}, here is what happened this week.</p>
                            {{#if hasNews}}
                            <p>We shipped <strong>{{ featureName }}</strong>.</p>
                            {{/if}}
                            <p>
                                <a href="{{ ctaUrl }}" style="color:#4f46e5;">Read the full update &raquo;</a>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px; font-family:Arial, sans-serif; color:#999999; font-size:12px;" align="center">
                            You are receiving this because you signed up.
                            <br>
                            <a href="{{ unsubscribeUrl }}">Unsubscribe</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
