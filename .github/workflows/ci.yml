name: CI

on: [push, pull_request]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: ['20', '22', '24', 'current']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      - if: matrix.node-version != 'current'
        run: npm test

      # TODO: The Node "current" entry skips c8 coverage because of a c8 bug.
      # Once https://github.com/bcoe/c8/issues/582 is fixed, drop this branch
      # and run the full `npm test` (with c8) on "current" as well.
      - if: matrix.node-version == 'current'
        run: npm run pretest && npm run test:mocha

  test-package:
    name: Check package health
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      # publint + arethetypeswrong (attw); the script builds dist first
      - run: npm run test:package

  test-docs:
    name: Run tests for docs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install docs dependencies
        run: npm install
        working-directory: docs

      - name: Test docs build
        run: npm run build
        working-directory: docs
