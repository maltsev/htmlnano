name: CI

on: [push, pull_request]

jobs:
  test:
    name: Run tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # See supported Node.js release schedule at https://github.com/nodejs/Release#release-schedule
        node-version: ['22', '24', 'current']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      - run: npm test

  test-cssnano:
    name: Test cssnano ${{ matrix.cssnano-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cssnano-version: ['7', '8']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install --no-save --package-lock=false cssnano@${{ matrix.cssnano-version }}

      - run: |
          npm run build
          npm run test:types
          npm run test:mocha

  test-package:
    name: Check package health
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      # publint + arethetypeswrong (attw); the script builds dist first
      - run: npm run test:package

  test-docs:
    name: Run tests for docs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Test docs build
        run: npm run build
        working-directory: docs
